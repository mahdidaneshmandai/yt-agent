# ساخت خودکار ویدیو -> آپلود یوتوب -> ارسال به Make برای ریل اینستاگرام (رایگان)
# هر روز ساعت ۷ UTC خودکار اجرا می‌شود. اگر صف خالی باشد خودش سناریو می‌نویسد.
# heartbeat: هر اجرا یک commit کوچک می‌زند تا GitHub بعد از ۶۰ روز بی‌فعالیتی cron را غیرفعال نکند.
name: make-video

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      privacy:
        description: "وضعیت انتشار ویدیو"
        type: choice
        default: public
        options:
          - public
          - private

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Build, upload and post one video
        run: python make_video.py
        env:
          PRIVACY: ${{ inputs.privacy || 'public' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}

      - name: Heartbeat (keeps schedule alive)
        if: always()
        run: |
          mkdir -p heartbeat
          date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat/last_run.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add heartbeat/last_run.txt
          git commit -m "heartbeat" || echo "nothing to commit"
          git push || echo "push skipped"
