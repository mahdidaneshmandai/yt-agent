# ساخت و آپلود یک ویدیو
# - اجرای خودکار روزانه (cron): هر روز ساعت ۷ UTC یک ویدیو می‌سازد و public منتشر می‌کند، حتی اگر تو آنلاین نباشی
# - اجرای دستی از تب Actions: می‌توانی privacy را روی private بگذاری (پیش‌فرض public است)
name: make-video

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      privacy:
        description: "وضعیت انتشار ویدیو"
        type: choice
        default: public
        options:
          - public
          - private

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Build and upload one video
        run: python make_video.py
        env:
          PRIVACY: ${{ inputs.privacy || 'public' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
